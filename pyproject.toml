[project]
name = "meritum-backend"
version = "0.1.0"
description = "Meritum: API w FastAPI razem z frontendem"
readme = "README.md"
authors = [{ name = "Cyprian Gburek" }]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.9.10",
    "cryptography>=50.0.2",
    "dbos>=3.6.0",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "itsdangerous>=2.2.0",
    "joserfc>=1.6.0",
    "meritum-core",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "behave>=1.3.3",
    "pytest>=9.2.0",
    "pytestarch>=5.1.1",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "vulture>=2.16",
]

# --------------------------------------------------------------------------- #
# Ruff: lint + format (the same config in core, backend and worker)
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests", "features"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",                                  # no per-file license headers
    "missing-trailing-comma",               # managed by `ruff format`
    "undocumented-magic-method",            # __eq__, __hash__ ... follow the data model
    "undocumented-public-init",             # documented in the class docstring
    # Pydantic and FastAPI read annotations at runtime: keep real imports.
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
]

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts and literals; tests/ is not a package (pytest importlib mode).
"tests/**/*.py" = ["assert", "magic-value-comparison", "D", "DOC", "implicit-namespace-package"]
"scripts/**/*.py" = ["implicit-namespace-package"]  # standalone scripts, not a package
# behave loads features/ by path, it is not a package; steps use plain asserts.
"features/**/*.py" = ["implicit-namespace-package", "assert"]
# Bare names tell vulture they are used; the file is never imported.
"vulture_whitelist.py" = ["implicit-namespace-package", "useless-expression"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # also turns off D203/D213 and the other non-Google rules

# Complexity limits: decompose instead of raising them (docs/architecture.md).
# Ruff's defaults, written out, except nested blocks and boolean expressions: a
# condition with more than 3 parts becomes named booleans or a predicate.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-statements = 50
max-returns = 6
max-locals = 15
max-nested-blocks = 3
max-bool-expr = 3

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# ty: strict
# --------------------------------------------------------------------------- #
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "scripts", "features"]

[tool.ty.rules]
all = "error"

# behave's given/when/then are untyped instances of a private class (behave 1.3).
[[tool.ty.overrides]]
include = ["features/steps/**"]
rules = { not-callable = "ignore", dynamic-function-decorator-return = "ignore" }

[tool.ty.terminal]
error-on-warning = true

# --------------------------------------------------------------------------- #
# Conventions Ruff and ty cannot express: scripts/check_conventions.py
# (docs/architecture.md). Every exception maps a path to its reason.
# --------------------------------------------------------------------------- #
[tool.meritum-conventions]
max-lines = 250

# --------------------------------------------------------------------------- #
# Dead code (vulture) and security (bandit)
# --------------------------------------------------------------------------- #
[tool.vulture]
paths = ["src", "scripts", "tests", "features", "vulture_whitelist.py"]
# FastAPI registers route functions through the router decorators.
ignore_decorators = ["@router.*", "@given", "@when", "@then"]
# behave calls the hooks in features/environment.py by name.
ignore_names = ["before_scenario"]
min_confidence = 60

# bandit is a security linter, not a dead-code tool. Ruff's S rules already run
# bandit's checks; bandit itself runs too because the team asked for it.
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
# Integration tests (real PostgreSQL, real providers) run only locally:
# `uv run pytest -m integration`; a later -m on the command line wins.
addopts = ["-ra", "--import-mode=importlib", "-m", "not integration"]
markers = ["integration: needs real services; skipped in CI, run with -m integration"]
filterwarnings = [
    "error",
    # slowapi 0.1.10 still calls asyncio.iscoroutinefunction (deprecated in 3.14).
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
]

[tool.uv.sources]
meritum-core = { git = "ssh://git@github.com/Meritum-HackNation2026/meritum-core.git", rev = "d77224b4dcb068c58b7ff4969a189ba50a81c968" }
